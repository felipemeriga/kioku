name: macOS Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-macos.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-macos.yml"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Check signed release manifest logic
        run: |
          python3 -m unittest discover -s desktop -p 'test_*.py'
          node --test desktop/window.test.cjs
      - name: Check Rust
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --check
          cargo test --release --locked --manifest-path desktop/Cargo.toml
          cargo clippy --release --locked --manifest-path desktop/Cargo.toml -- -D warnings
      - name: Build app and DMG
        env:
          KIOKU_DESKTOP_PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_P8: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          if [ "$KIOKU_DESKTOP_PRODUCTION" = true ]; then
            APPLE_API_KEY_PATH="$(python3 desktop/apple_signing.py prepare)"
            export APPLE_API_KEY_PATH
            test -n "$APPLE_API_KEY_PATH"
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "Missing production updater signing key" >&2
              exit 1
            fi
            npx --yes @tauri-apps/cli@2.12.4 signer generate --ci -p '' -w "$RUNNER_TEMP/update-test.key" > "$RUNNER_TEMP/key-generation.log"
            export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/update-test.key")"
          fi
          ./desktop/build-macos.sh
          if [ "$KIOKU_DESKTOP_PRODUCTION" = true ]; then
            python3 desktop/apple_signing.py verify
          fi
          cp "desktop/target/release/bundle/macos/Kioku Alpha.app.tar.gz" "desktop/target/release/bundle/Kioku-Alpha-${{ matrix.arch }}.app.tar.gz"
          cp "desktop/target/release/bundle/macos/Kioku Alpha.app.tar.gz.sig" "desktop/target/release/bundle/Kioku-Alpha-${{ matrix.arch }}.app.tar.gz.sig"
      - name: Remove temporary Apple credentials
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 desktop/apple_signing.py cleanup
      - name: Verify app signature and archive
        run: |
          codesign --verify --deep --strict "desktop/target/release/bundle/macos/Kioku Alpha.app"
          ditto -c -k --sequesterRsrc --keepParent "desktop/target/release/bundle/macos/Kioku Alpha.app" "desktop/target/release/bundle/Kioku-Alpha-${{ matrix.arch }}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Kioku-Alpha-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/*.app.tar.gz*
            desktop/target/release/bundle/*.app.zip
            desktop/target/release/bundle/dmg/*.dmg

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Kioku-Alpha-macOS-*
          path: desktop-artifacts
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify signatures and generate update manifest
        run: python3 desktop/publish.py desktop-artifacts
      - name: Publish versioned desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("desktop/tauri.conf.json"))["version"])')
          tag="desktop-v$version"
          if gh release view "$tag" --json isDraft > /tmp/desktop-release.json 2>/dev/null; then
            if python3 -c 'import json,sys; sys.exit(0 if not json.load(open("/tmp/desktop-release.json"))["isDraft"] else 1)'; then
              echo "Version already published; preserving immutable release."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Kioku Desktop $version" --notes "macOS for Apple Silicon and Intel. Signed with Developer ID Application (team KFCS65DU8T), hardened runtime enabled, and app/DMG notarized by Apple. Download the matching DMG."
          fi
          mapfile -d '' files < <(find desktop-artifacts -type f \( -name '*.dmg' -o -name '*.app.zip' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name 'latest.json' \) -print0)
          test "${#files[@]}" -eq 9
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest=false
