  <div class="ko-demo"><span>Interactive prototype · sample sessions, November–December 2026</span><label>Explore <select data-action="scenario" aria-label="Prototype scenario"><option value="journal">Journal and evidence</option><option value="long">30-day session</option><option value="missing">Incomplete evidence</option><option value="legacy">Older journal entry</option></select></label></div>
  <div class="ko-app">
    <div class="ko-app-top"><span class="ko-logo" aria-hidden="true">記</span><span class="ko-breadcrumb">Kioku <span aria-hidden="true"> / </span> Repositories <span aria-hidden="true"> / </span> <b>kioku</b> <span aria-hidden="true"> / </span> Learnings</span></div>
    <main class="ko-main"></main>
    <div class="ko-overlay"></div>
  </div>
  <div class="ko-sr" aria-live="polite" data-status></div>
  <script>
  (()=>{
    const root=document.getElementById('kioku-originals-prototype');
    const dates=['2026-11-04','2026-11-07','2026-11-10','2026-11-14','2026-11-18','2026-11-22','2026-11-26','2026-12-03'];
    const state={month:10,year:2026,day:'2026-11-04',journalReturnDay:'2026-11-04',view:'journal',drawer:false,full:false,mode:'conversation',child:false,start:1,end:6,selected:3,expanded:new Set(),attachment:false,scenario:'journal',markdown:false};
    let returnFocus=null;
    const main=root.querySelector('main'),overlay=root.querySelector('.ko-overlay');
    const agentName=()=>state.scenario==='missing'?'Codex':'Claude Code';
    const sessionId=()=>state.scenario==='missing'?'01a1a680':'8dd720ab';
    const nativeSessionId=()=>state.scenario==='missing'?'01a1a680-9088-7be2-8357-76c9d9521663':'8dd720ab-0182-46f2-a6eb-bcc000d4f48f';
    function renderSessionIdentity(){return `<span class="ko-chip">${agentName()}</span>${button('Session '+sessionId(),'copy-session',`title="${nativeSessionId()}" aria-label="Copy session ID: ${nativeSessionId()}"`,'ko-link')}`;}
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dayLabel=d=>new Intl.DateTimeFormat('en',{month:'long',day:'numeric'}).format(new Date(d+'T12:00:00'));
    const shortLabel=d=>new Intl.DateTimeFormat('en',{month:'short',day:'numeric'}).format(new Date(d+'T12:00:00'));
    const fullLabel=d=>new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date(d+'T12:00:00'));
    const button=(label,action,extra='',classes='')=>`<button type="button" class="cursor-interaction ${classes}" data-action="${action}" ${extra}>${label}</button>`;
    const events=dates.flatMap((date,dayIndex)=>[
      {date,time:'14:32',role:'user',text:dayIndex?'Continue the invoice investigation. Keep the recorded outcome separate from the next requirement.':'Check the invoice fixture and ask a subagent to verify the source notes independently.'},
      {date,time:'14:33',role:'assistant',text:'I’ll inspect the source notes, run the fixture, and verify the result before changing anything.'},
      {date,time:'14:34',role:'tool',name:'Read · NOTES.txt',output:'POC_SOURCE_MARKER violet-otter-47\nThe invoice total is 31, not 30.\nUnicode: 余白 café 🦦'},
      {date,time:'14:35',role:'tool',name:'Bash · python3 fixture.py',output:'POC_TOOL_RESULT total=31 unicode=余白 café\nExit code: 0'},
      {date,time:'14:36',role:'child',text:'notes_check independently checked the source notes.',output:'POC_CHILD_MARKER · violet-otter-47 · corrected total 31'},
      {date,time:'14:42',role:'assistant',text:dayIndex>0?'The observed result is still 31. The new target is 42, but no execution has verified that target. Caching remains a proposal; it has not been implemented.':'The fixture returned 31 and the assertion passed. The child independently confirmed the same source marker and total. Caching has not been implemented.'},
      {date,time:'14:48',role:'large',name:'Bash · large-output verification',output:'POC_LARGE_BEGIN\nXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\n[Preview: first 2 KB]\nFull output retained as an attachment.'}
    ].map((e,index)=>({...e,id:`evt-${dayIndex*7+index+1}`,ordinal:dayIndex*7+index})));
    const children=[
      {date:'2026-11-04',time:'14:36',role:'user',text:'Read NOTES.txt independently and report the source marker and corrected total.',id:'child-1',ordinal:0},
      {date:'2026-11-04',time:'14:37',role:'tool',name:'Read · NOTES.txt',output:'POC_SOURCE_MARKER violet-otter-47\nThe invoice total is 31, not 30.\nUnicode: 余白 café 🦦',id:'child-2',ordinal:1},
      {date:'2026-11-04',time:'14:38',role:'assistant',text:'POC_CHILD_MARKER\nSource marker: violet-otter-47\nCorrected invoice total: 31.',id:'child-3',ordinal:2}
    ];
    function announce(text){root.querySelector('[data-status]').textContent=text;}
    const runtimeOrigin='kioku-originals-'+Math.random().toString(36).slice(2);
    function saveState(){
      if(!window.openai?.setWidgetState)return;
      const privateContent={...state,expanded:[...state.expanded],originId:runtimeOrigin};
      try{Promise.resolve(window.openai.setWidgetState({modelContent:{prototype:'learnings-originals',scenario:state.scenario},privateContent})).catch(()=>{});}catch{}
    }
    function renderCalendar(){
      const first=(new Date(state.year,state.month,1).getDay()+6)%7,count=new Date(state.year,state.month+1,0).getDate();
      const cells=Array.from({length:first},()=>'<span></span>');
      for(let n=1;n<=count;n++){
        const date=`${state.year}-${String(state.month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
        cells.push(button(n,'day',`data-day="${date}" aria-label="${fullLabel(date)}${dates.includes(date)?', journal entries':', no entries'}" aria-pressed="${date===state.day}"`,dates.includes(date)?'ko-active-day':''));
      }
      return `<aside class="ko-calendar" aria-label="Journal calendar"><div class="ko-month">${button('‹','previous-month','aria-label="Previous month"','ko-icon')}<span>${new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(new Date(state.year,state.month,1))}</span>${button('›','next-month','aria-label="Next month"','ko-icon')}</div><div class="ko-week">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div><div class="ko-grid">${cells.join('')}</div><div class="ko-legend"><span><i class="ko-dot"></i>Claude Code</span><span><i class="ko-dot pink"></i>Codex</span></div><div class="ko-calendar-foot">Journal entries grouped by your timezone.<br>America/Sao_Paulo</div></aside>`;
    }
    function renderJournal(){
      const active=dates.includes(state.day),legacy=state.scenario==='legacy';
      const markdown=`# Agent journal — ${state.day}\n\n## 14:35 — ${agentName()}\n- Ran the invoice fixture. Observed total: 31.\n- A child independently confirmed violet-otter-47.\n- Caching has NOT been implemented.\n\n## 15:02 — ${agentName()}\n- New future requirement: 42. Not verified by execution.`;
      return `<h2>Learnings</h2><p class="ko-subtitle">Agent journal and current learnings from this repository.</p><div class="ko-tabs">${button('Journal','journal','aria-pressed="true"')}${button('Current learnings','learnings','aria-pressed="false"')}</div><div class="ko-journal">${renderCalendar()}<section class="ko-day-panel"><div class="ko-day-head"><div><h3>${dayLabel(state.day)}, ${state.day.slice(0,4)}</h3><div class="ko-meta">${active?'2 entries · 1 session':'No entries'} · America/Sao_Paulo</div></div>${active?button(state.markdown?'Timeline':'Markdown','markdown'):''}</div>${!active?'<p class="ko-empty">No agent interactions recorded on this day.</p>':state.markdown?`<pre class="ko-markdown">${esc(markdown)}</pre>`:`<div class="ko-session"><div class="ko-meta">${renderSessionIdentity()}<span>Session ${sessionId()}</span><span>Felipe’s Mac</span></div><div class="ko-session-title">Validate invoice totals and capture evidence</div><div class="ko-session-summary">Checked the invoice fixture, independently verified the source notes, and kept the future requirement separate from the observed result.</div><div class="ko-meta" style="margin-top:10px">Session continues across 8 active days</div>${legacy?'<div class="ko-quiet-note">Originals unavailable · summary retained</div>':button('Open full transcript','full','style="margin-top:8px"','ko-link')}</div><article class="ko-entry"><div class="ko-meta"><time>14:35</time>${renderSessionIdentity()}<span>Verified outcome</span></div><p>The fixture returned <strong>31</strong> and the assertion passed. The child independently confirmed <code>violet-otter-47</code> and the corrected total.</p><div class="ko-entry-footer">${legacy?'<span>Original evidence unavailable for this older entry.</span>':button('View evidence','evidence','','ko-link')}<span>${legacy?'Summary retained':'4 source turns · originals available'}</span></div></article><article class="ko-entry"><div class="ko-meta"><time>15:02</time>${renderSessionIdentity()}<span>Requirement changed</span></div><p>The future target is now <strong>42</strong>. No new execution has verified it. Caching remains a proposal and has <strong>not been implemented</strong>.</p><div class="ko-entry-footer">${legacy?'<span>Original evidence unavailable for this older entry.</span>':button('View evidence','later-evidence','','ko-link')}<span>${legacy?'Summary retained':'3 source turns · originals available'}</span></div></article>`}</section></div><div class="ko-footer"><span>Journal summaries remain unchanged. Originals open alongside them.</span>${legacy?'<span>Original capture was not enabled for this session.</span>':button('Open original session','full','','ko-link')}</div>`;
    }
    function renderEvent(event){
      const selected=!state.child&&event.ordinal===state.selected,expanded=state.expanded.has(event.id),missing=state.scenario==='missing';
      let content='';
      if(event.role==='tool'||event.role==='large'){
        const large=event.role==='large';
        content=`<div class="ko-tool-head"><strong>${esc(event.name)}</strong>${button(expanded?'Collapse':'Expand','tool',`data-id="${event.id}" aria-expanded="${expanded}"`)}</div><div class="ko-meta" style="margin-top:4px">Exit 0${large?' · 68.4 KB':' · completed'}</div>${expanded?`<pre>${esc(large&&missing?'POC_LARGE_BEGIN\nXXXXXXXXXXXXXXXXXXXXXXXX\n[Output truncated upstream. Full original output is unavailable.]':event.output)}</pre>`:''}${large?(missing?'<div class="ko-notice">This tool output was truncated before capture. No complete attachment is available.</div>':`<div class="ko-attachment"><span>▤ <strong>output.txt</strong> <span class="ko-muted">· 68.4 KB · full output retained</span></span>${button(state.attachment?'Close preview':'Preview attachment','attachment')}</div>${state.attachment?'<pre>POC_LARGE_BEGIN\nXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\n… 70,000 X characters in the captured output …\nXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\nPOC_LARGE_END</pre><div class="ko-quiet-note">Demo preview · the production reader loads the archived attachment on demand.</div>':''}`):''}`;
      }else if(event.role==='child'){
        content=`<strong>Subagent · notes_check</strong><p>${esc(event.text)}</p><div class="ko-child-link"><span class="ko-muted">3 source events · independent read</span>${button('View child evidence','child','','ko-link')}</div>`;
      }else content=`<p>${esc(event.text).replace(/\n/g,'<br>')}</p>`;
      return `<article class="ko-event ${event.role==='user'?'ko-user':''} ${selected?'ko-selected':''}" data-event="${event.id}">${selected?'<div class="ko-selection-label">Source linked from your journal</div>':''}<div class="ko-event-head"><strong>${event.role==='user'?'You':event.role==='assistant'?agentName():event.role==='child'?'Child session':'Tool result'}</strong><span>${event.time}</span></div>${content}<div class="ko-source-label">${state.child?'child/notes_check':'session/'+sessionId()} · ${event.id}</div></article>`;
    }
    function nativeSampleRecord(event){
      const timestamp=`${event.date}T${event.time}:00-03:00`,sid=state.child?'notes_check':sessionId();
      const isTool=event.role==='tool'||event.role==='large';
      const output=event.role==='large'&&state.scenario==='missing'?'POC_LARGE_BEGIN\n[Output truncated upstream; complete output unavailable]':event.output;
      if(state.scenario==='missing'){
        const payload=isTool?{type:'custom_tool_call_output',call_id:'call-'+event.id,output:output}:{type:'message',role:event.role==='user'?'user':'assistant',content:[{type:event.role==='user'?'input_text':'output_text',text:event.text||event.output||'Child session: notes_check'}]};
        return {timestamp,type:'response_item',payload};
      }
      return {type:isTool||event.role==='user'?'user':'assistant',uuid:event.id,parentUuid:null,sessionId:sid,timestamp,message:{role:isTool||event.role==='user'?'user':'assistant',content:isTool?[{type:'tool_result',tool_use_id:'call-'+event.id,content:output}]:[{type:'text',text:event.text||event.output||'Child session: notes_check'}]}};
    }
    function renderTranscript(){
      const list=state.child?children:events.slice(state.start,state.end),raw=list.map(nativeSampleRecord);
      let lastDate='';
      const body=state.mode==='raw'?`<p class="ko-meta">Sample ${agentName()} source records · illustrative native schema</p><pre class="ko-raw">${esc(raw.map(r=>JSON.stringify(r,null,2)).join('\n\n'))}</pre>`:list.map(e=>{const divider=lastDate!==e.date?`<div class="ko-date-divider">${fullLabel(e.date)}</div>`:'';lastDate=e.date;return divider+renderEvent(e);}).join('');
      return `${state.full?'':`<div class="ko-reader-head"><div class="ko-reader-actions">${renderSessionIdentity()}<div>${button('Open full transcript','full','','ko-link')}${button('×','close','aria-label="Close evidence"','ko-icon')}</div></div><div class="ko-reader-title">${state.child?'notes_check · child session':'Validate invoice totals'}</div><div class="ko-meta">${state.child?'Child of session '+sessionId():'Session '+sessionId()+' · November 4 – December 3'}</div><div class="ko-status" style="margin-top:7px">Captured through December 3, 14:49 · ${state.scenario==='missing'?'one source gap':'originals synced'}</div></div>`}<div class="ko-reader-toolbar"><div class="ko-switch" aria-label="Evidence presentation">${button('Conversation','conversation',`aria-pressed="${state.mode==='conversation'}"`)}${button('Raw source','raw',`aria-pressed="${state.mode==='raw'}"`)}</div>${state.child?button('‹ Back to parent','parent','','ko-link'):`<label class="ko-meta">Jump to date <select data-action="jump-day" aria-label="Jump to session day">${dates.map(d=>`<option value="${d}" ${events[state.start]?.date===d?'selected':''}>${shortLabel(d)}</option>`).join('')}</select></label>`}</div><div class="ko-reader-body">${state.child?'<p class="ko-meta">Independent child execution · inherited parent context hidden</p>':button('↑ Load earlier','earlier',state.start===0?'disabled':'','ko-page-control')}${body}${state.child?'':button('Load later ↓','later',state.end>=events.length?'disabled':'','ko-page-control')}<div class="ko-reader-end">${state.child?'3 child events':`${state.start+1}–${state.end} of ${events.length} events · only this window is shown`}${state.mode==='raw'?' · sample raw records, not captured production data':''}</div></div>`;
    }
    function renderFull(){
      return `<div class="ko-full-head"><div>${button('‹ Back to journal','back-journal','','ko-link')}<h2 style="margin-top:10px">${state.child?'notes_check':'Validate invoice totals'}</h2><div class="ko-meta">${renderSessionIdentity()}<span>November 4 – December 3 · 8 active days</span><span class="ko-status">Captured through 14:49</span></div></div><span class="ko-meta">Original evidence</span></div><div class="ko-full-layout"><aside class="ko-days-sidebar"><h3>Active session days</h3>${dates.map(d=>button(`${shortLabel(d)} <span>7 events</span>`,'reader-day',`data-day="${d}" aria-pressed="${events[state.start]?.date===d&&!state.child}"`)).join('')}<div class="ko-quiet-note">One session across 30 days.<br>Idle days aren’t evidence gaps.</div></aside><section class="ko-full-reader">${renderTranscript()}</section></div>`;
    }
    function render(){
      main.innerHTML=state.full?renderFull():state.view==='learnings'?`<h2>Learnings</h2><p class="ko-subtitle">Agent journal and current learnings from this repository.</p><div class="ko-tabs">${button('Journal','journal','aria-pressed="false"')}${button('Current learnings','learnings','aria-pressed="true"')}</div><section class="ko-day-panel"><h3>Keep observed outcomes separate from requirements</h3><p style="margin-top:12px">The fixture verified total <strong>31</strong>. The target <strong>42</strong> is a later requirement, not a verified result.</p><div class="ko-meta">Reported · supported by journal entries</div>${button('November 4 · View journal source','journal','','ko-link')}</section>`:renderJournal();
      overlay.innerHTML=state.drawer&&!state.full?`<div class="ko-scrim"><section class="ko-drawer" role="dialog" aria-modal="true" aria-label="Original evidence">${renderTranscript()}</section></div>`:'';
    }
    function jump(day){state.child=false;state.day=day;state.month=Number(day.slice(5,7))-1;state.year=Number(day.slice(0,4));const i=dates.indexOf(day);state.start=Math.max(0,i*7);state.end=Math.min(events.length,state.start+7);state.selected=state.start+3;state.expanded.clear();state.attachment=false;}
    function restoreFocus(){root.querySelector(`[data-action="${returnFocus?.dataset?.action||'evidence'}"]`)?.focus();}
    function openEvidence(later=false){returnFocus=document.activeElement;state.journalReturnDay=state.day;state.drawer=true;state.full=false;state.child=false;state.mode='conversation';const i=Math.max(0,dates.indexOf(state.day));state.start=i*7+(later?4:1);state.end=Math.min(events.length,i*7+7);state.selected=i*7+(later?5:3);state.expanded=new Set([events[i*7+3].id]);render();overlay.querySelector('[data-action="close"]')?.focus();saveState();announce('Original evidence opened at the journal source.');}
    root.addEventListener('click',event=>{
      const el=event.target.closest('[data-action]');if(!el||el.tagName==='SELECT')return;
      const action=el.dataset.action;
      if(action==='copy-session'){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(nativeSessionId()).then(()=>announce('Session ID copied.')).catch(()=>announce('Session ID: '+nativeSessionId()));else announce('Session ID: '+nativeSessionId());return;}
      if(action==='evidence'||action==='later-evidence'){openEvidence(action==='later-evidence');return;}
      if(action==='close'){state.drawer=false;render();restoreFocus();saveState();return;}
      if(action==='previous-month'||action==='next-month'){const next=new Date(state.year,state.month+(action==='next-month'?1:-1),1);state.month=next.getMonth();state.year=next.getFullYear();}
      if(action==='day'){state.day=el.dataset.day;state.markdown=false;}
      if(action==='journal'){state.view='journal';state.full=false;state.drawer=false;}
      if(action==='learnings'){state.view='learnings';state.full=false;state.drawer=false;}
      if(action==='markdown')state.markdown=!state.markdown;
      if(action==='full'){if(state.scenario==='legacy'){announce('Original evidence is unavailable for this older session.');return;}if(!state.drawer)state.journalReturnDay=state.day;state.full=true;state.drawer=false;if(!dates.includes(state.day))jump(dates[0]);}
      if(action==='back-journal'){state.full=false;state.drawer=false;state.view='journal';state.day=state.journalReturnDay;state.month=Number(state.day.slice(5,7))-1;state.year=Number(state.day.slice(0,4));}
      if(action==='conversation'||action==='raw')state.mode=action;
      if(action==='earlier')state.start=Math.max(0,state.start-4);
      if(action==='later')state.end=Math.min(events.length,state.end+4);
      if(action==='reader-day')jump(el.dataset.day);
      if(action==='child'){state.child=true;state.mode='conversation';}
      if(action==='parent')state.child=false;
      if(action==='tool'){state.expanded.has(el.dataset.id)?state.expanded.delete(el.dataset.id):state.expanded.add(el.dataset.id);}
      if(action==='attachment')state.attachment=!state.attachment;
      render();const focusScope=state.drawer?overlay:main;const focusTarget=focusScope.querySelector(`[data-action="${action}"]`)||focusScope.querySelector('button');focusTarget?.focus({preventScroll:true});saveState();announce(action==='reader-day'?`Showing evidence from ${dayLabel(state.day)}.`:action==='raw'?'Showing sample raw records.':'View updated.');
    });
    root.addEventListener('change',event=>{
      const action=event.target.dataset.action;
      if(action==='jump-day')jump(event.target.value);
      if(action==='scenario'){
        state.scenario=event.target.value;state.drawer=false;state.full=false;state.view='journal';state.mode='conversation';state.child=false;state.markdown=false;jump('2026-11-04');
        if(state.scenario==='long'){state.full=true;jump('2026-11-18');}
        if(state.scenario==='missing'){state.drawer=true;state.start=3;state.end=7;state.expanded=new Set(['evt-7']);}
      }
      render();saveState();
    });
    root.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&state.drawer){state.drawer=false;render();restoreFocus();saveState();}
      if(event.key==='Tab'&&state.drawer){const buttons=[...overlay.querySelectorAll('button:not(:disabled),select')];if(!buttons.length)return;const first=buttons[0],last=buttons[buttons.length-1];if(!overlay.contains(document.activeElement)){event.preventDefault();first.focus();}else if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    });
    function restoreState(snapshot){
      const saved=snapshot?.privateContent;
      if(!saved||typeof saved!=='object'||saved.originId===runtimeOrigin)return false;
      if(['journal','long','missing','legacy'].includes(saved.scenario))state.scenario=saved.scenario;
      if(['journal','learnings'].includes(saved.view))state.view=saved.view;
      for(const key of ['day','journalReturnDay'])if(typeof saved[key]==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(saved[key])&&!Number.isNaN(Date.parse(saved[key])))state[key]=saved[key];
      if(Number.isInteger(saved.month)&&saved.month>=0&&saved.month<=11)state.month=saved.month;
      if(Number.isInteger(saved.year)&&saved.year>=2020&&saved.year<=2100)state.year=saved.year;
      for(const key of ['drawer','full','child','attachment','markdown'])if(typeof saved[key]==='boolean')state[key]=saved[key];
      if(Number.isInteger(saved.start))state.start=Math.max(0,Math.min(events.length-1,saved.start));
      if(Number.isInteger(saved.end))state.end=Math.max(state.start+1,Math.min(events.length,saved.end));
      if(Number.isInteger(saved.selected))state.selected=Math.max(0,Math.min(events.length-1,saved.selected));
      if(Array.isArray(saved.expanded))state.expanded=new Set(saved.expanded.filter(id=>typeof id==='string'&&/^(evt|child)-\d+$/.test(id)));
      if(['conversation','raw'].includes(saved.mode))state.mode=saved.mode;
      if(state.full)state.drawer=false;
      if(state.scenario==='legacy'){state.drawer=false;state.full=false;}
      root.querySelector('[data-action="scenario"]').value=state.scenario;
      return true;
    }
    restoreState(window.openai?.widgetState);
    window.addEventListener('openai:set_globals',event=>{if(restoreState(event.detail?.globals?.widgetState))render();});
    render();
  })();
  </script>
</div>
