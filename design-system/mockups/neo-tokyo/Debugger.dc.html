<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kioku inspect dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08040F}
a{color:#00F0FF}a:hover{color:#F5F0FF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background-color: #050208; color: #F5F0FF; font-family: Rubik, sans-serif;">
  <div role="dialog" aria-label="Inspect" style="position: absolute; left: 50%; top: 70px; width: 860px; margin-left: -430px; height: 760px; display: flex; flex-direction: column; border: 1px solid #00F0FF; border-radius: 4px; background-color: #0A0517; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.016) 0px, rgba(255,255,255,0.016) 1px, transparent 1px, transparent 3px); box-shadow: 0 0 4px #00F0FF88, 0 0 24px #00F0FF33, 0 24px 64px rgba(0,0,0,0.7);">
    <header style="display: flex; align-items: center; gap: 12px; padding: 18px 22px;">
      <h1 style="margin: 0; font-size: 19px; font-weight: 700;">Inspect</h1>
      <span style="padding: 3px 8px; border-radius: 3px; background: #00F0FF14; border: 1px solid #00F0FF66; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #00F0FF;">claude-sonnet</span>
      <div style="flex-grow: 1;"></div>
      <button aria-label="Close" style="width: 34px; height: 34px; border-radius: 3px; border: 1px solid #2A1758; background: transparent; color: #9788B8; font-size: 15px;">✕</button>
    </header>
    <div style="display: flex; gap: 2px; padding: 0 22px; border-bottom: 1px solid #2A1758;">
      <a href="#" style="padding: 12px 16px; text-decoration: none; color: #9788B8; font-weight: 600; font-size: 14px;">Reasoning (2)</a>
      <a href="#" style="padding: 12px 16px; text-decoration: none; color: #9788B8; font-weight: 600; font-size: 14px;">Tool calls (2)</a>
      <a href="#" style="padding: 12px 16px; text-decoration: none; color: #FF6DB1; font-weight: 600; font-size: 14px; background: #FF2E9318; box-shadow: inset 0 -2px 0 #FF2E93;">Chunks (2)</a>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; overflow: hidden;">
      <sc-for list="{{chunks}}" as="c" hint-placeholder-count="2">
        <div style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 4px; border: 1px solid #2A1758; background: #0F0820;">
          <div style="position: absolute; left: -1px; top: -1px; width: 12px; height: 12px; border-left: 2px solid #00F0FF; border-top: 2px solid #00F0FF;"></div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="padding: 2px 8px; border-radius: 3px; background: {{c.kc}}22; border: 1px solid {{c.kc}}88; color: {{c.kc}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;">{{c.kind}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">{{c.src}}</span>
            <div style="flex-grow: 1;"></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9788B8;">rerank <span style="color: #FF6DB1; font-size: 15px; text-shadow: 0 0 8px #FF2E9388;">{{c.score}}</span></span>
          </div>
          <div style="height: 6px; background: #2A1758;"><div style="height: 6px; width: {{c.w}}; background-image: linear-gradient(90deg, #D31877, #FF2E93); box-shadow: 0 0 8px #FF2E93;"></div></div>
          <pre style="margin: 0; padding: 12px 14px; border-radius: 4px; background: #050208; border: 1px solid #2A1758; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: #F5F0FF;">{{c.text}}</pre>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      chunks: [
        { kind: 'doc', kc: '#93c5fd', src: 'ragas_eval_report.html', score: '0.910', w: '91%', text: 'With the cross-encoder reranker, recall@10 rose from 0.71 to 0.84 on the golden set.' },
        { kind: 'doc', kc: '#93c5fd', src: 'hybrid_search_rrf.md', score: '0.770', w: '77%', text: 'RRF with k=60 fuses BM25 and pgvector results before reranking.' }
      ]
    };
  }
}
</script>
</body>
</html>
