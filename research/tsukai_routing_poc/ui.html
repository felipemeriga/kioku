<!doctype html><html lang="en"><meta charset="utf-8"><title>Tsukai isolated routing POC</title><style>body{font:16px system-ui;background:#100b20;color:#eee;max-width:850px;margin:40px auto}button,select,textarea{font:inherit;margin:8px;padding:10px}textarea{width:90%;height:90px}pre{white-space:pre-wrap;padding:20px;border:1px solid #715c89}</style><h1>Tsukai isolated routing POC</h1><label>Engine <select id="engine"><option>native</option><option>api</option></select></label><textarea id="prompt">Evidence: PostgreSQL outbox uses event_id deduplication and MAX_ATTEMPTS=7. Explain the retry limit and duplicate protection in two concise sentences.</textarea><button id="send">Send through backend</button><p id="state">Ready</p><pre id="answer"></pre><pre id="timings"></pre><script>
window.pocRuns=[];document.querySelector('#send').onclick=async()=>{const started=performance.now(),run={engine:engine.value,events:0};answer.textContent='';state.textContent='Running';const response=await fetch('/invoke',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer ui-fixture'},body:JSON.stringify({engine:engine.value,path:'chat',prompt:document.querySelector('#prompt').value})});const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;while((end=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,end);buffer=buffer.slice(end+1);if(!line.startsWith('data: '))continue;const event=JSON.parse(line.slice(6));run.events++;if(event.type==='text'){if(run.firstRenderMs===undefined)run.firstRenderMs=performance.now()-started;answer.textContent+=event.text;}if(event.type==='result'){run.success=event.success;run.model=event.model;run.completeMs=performance.now()-started;run.answer=event.text;state.textContent=event.success?'Completed':'Failed';}}}window.pocRuns.push(run);timings.textContent=JSON.stringify(run,null,2);};
</script></html>
