- id: q008
  question: "Why is Lucene's segment-based storage model efficient for concurrent reads?"
  ground_truth_answer: |
    Lucene's segments are immutable after being written, which means Lucene
    never needs complex concurrent write locking. Because segments never change,
    the operating system can aggressively cache them. Deletions are recorded in
    a per-segment deletion bitmap rather than rewriting the segment. Space is
    reclaimed only when a background merge rewrites and combines smaller segments
    into larger ones. This design lets many readers access the same on-disk
    segments simultaneously with no coordination overhead.
  relevant_chunk_ids:
    - "sha256:51e7e4448cf11eab6857dd27a509624d8fbed058c4f484f8b8f75d35f2ec7f32:chunk_0"
  difficulty: medium
  retrieval_type: factual

- id: q009
  question: "What is the purpose of the 'k' constant in the RRF formula and what is its common value?"
  ground_truth_answer: |
    In Reciprocal Rank Fusion, the constant k smooths the impact of
    high-ranked items so that a single top-ranked result does not dominate the
    fused score. The formula gives each document a score of 1 / (k + rank),
    so when k is 60 the difference between rank 1 and rank 2 is only 1/61
    versus 1/62. The value 60 was empirically found to reduce sensitivity to
    particularly high-ranked outliers and is the widely adopted default. Smaller
    k values give more weight to top-ranked results.
  relevant_chunk_ids:
    - "sha256:ccd43a8b62604a70ced2117351fefe44b1067c24de26c1a3e2220845ab1b51f8:chunk_0"
  difficulty: medium
  retrieval_type: factual

- id: q010
  question: "What RAGAS metric requires a ground-truth reference answer, and how does it work?"
  ground_truth_answer: |
    Context recall is the RAGAS metric that requires a ground-truth reference
    answer. It measures whether all information needed to answer the question
    was present in the retrieved context. RAGAS checks how many claims in the
    reference answer are supported by the retrieved chunks, using an LLM judge
    to decompose the reference into atomic statements and verify each one
    against the retrieved context. The other RAGAS metrics — faithfulness,
    answer relevancy, and context precision — do not require a ground-truth
    answer.
  relevant_chunk_ids:
    - "sha256:d252ad465272de64c9121999f153b142a8de17137f6c56afd72944110aad5e6b:chunk_0"
    - "sha256:d252ad465272de64c9121999f153b142a8de17137f6c56afd72944110aad5e6b:chunk_1"
  difficulty: medium
  retrieval_type: factual

