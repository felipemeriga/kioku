- id: q021
  question: "What is the nprobe parameter in IVFFlat and what is its default value in pgvector?"
  ground_truth_answer: |
    The nprobe parameter in IVFFlat controls how many Voronoi cells are probed
    at query time. Higher nprobe values improve recall because more cells are
    scanned, but increase query latency. At nprobe equal to the total number of
    lists, the search becomes an exact full scan. In pgvector, the default value
    of ivfflat.probes is 1, which is very low for real workloads and typically
    needs to be raised to between 10 and 100 for acceptable recall in production.
  relevant_chunk_ids:
    - "sha256:6e788380c1a8450cd23b60dc08e52716e934f0d4fc205d9094c8c22caa8832d0:chunk_0"
    - "sha256:6e788380c1a8450cd23b60dc08e52716e934f0d4fc205d9094c8c22caa8832d0:chunk_1"
  difficulty: easy
  retrieval_type: factual

- id: q022
  question: "How does PostgreSQL's tsvector represent a document for full-text search?"
  ground_truth_answer: |
    A tsvector is a sorted list of lexemes — normalized word stems with their
    positions in the original document. Postgres uses a language-specific text
    search configuration to stem words and remove stop words. For example, the
    phrase "Vector databases store high-dimensional embeddings" becomes lexemes
    like 'databas', 'dimension', 'embed', 'high', 'store', and 'vector' with
    their positional offsets. Weights (A, B, C, D) can be assigned to lexemes
    to boost matches in important fields such as document titles.
  relevant_chunk_ids:
    - "sha256:93e198fe36bc6adef783e2eb03f7c9e1b3f9f1109f7f913d62c676f573038545:chunk_0"
  difficulty: easy
  retrieval_type: factual

- id: q023
  question: "What input_type values does the Voyage AI embedding API accept, and how do they differ?"
  ground_truth_answer: |
    The Voyage AI API accepts two input_type values: 'query' and 'document'.
    Using 'query' produces embeddings optimized for matching against documents,
    and should be used for user queries at search time. Using 'document' produces
    embeddings optimized for being retrieved, and should be used when embedding
    corpus documents at ingestion time. This asymmetric embedding design is
    sometimes called a bi-encoder with input type conditioning and typically
    improves retrieval quality compared to using a single embedding function for
    both sides.
  relevant_chunk_ids:
    - "sha256:82eb0d003ee2760677e76edd69e14b298535e99864251d816241f4de736bdf15:chunk_0"
  difficulty: easy
  retrieval_type: factual

- id: q024
  question: "What IR metric is most appropriate when the primary goal is ensuring the correct chunk appears somewhere in the retrieved context, and why?"
  ground_truth_answer: |
    Recall@K is the most appropriate metric when the primary goal is ensuring
    the correct chunk appears in the retrieved context. It measures the fraction
    of all relevant documents that appear in the top-K results, regardless of
    their position. For RAG systems the LLM can only use what was retrieved, so
    if the correct chunk is not in the top-K, no amount of reranking or
    generation quality can compensate. Recall@5 and Recall@10 are the primary
    metrics recommended for most RAG evaluation harnesses, rather than
    Precision@K which measures whether irrelevant results were excluded.
  relevant_chunk_ids:
    - "sha256:90c30ce03a8aa1f13662e1eae01a3455fd0b5767e3164fd0f4c2e96097707016:chunk_0"
    - "sha256:90c30ce03a8aa1f13662e1eae01a3455fd0b5767e3164fd0f4c2e96097707016:chunk_1"
  difficulty: medium
  retrieval_type: factual

- id: q025
  question: "How does Claude's tool_choice parameter differ from the default 'auto' behavior, and when would you force a specific tool?"
  ground_truth_answer: |
    The default tool_choice value of 'auto' lets Claude decide whether to call
    any tool or generate a plain text response. Setting it to 'any' forces Claude
    to call at least one tool from the available set. Setting it to a specific
    tool by name forces Claude to call exactly that named tool. Forcing a specific
    tool is useful for structured extraction tasks where you always want Claude to
    return a typed JSON schema rather than prose — for example, when extracting
    document metadata or classifying user intent into a predefined category.
  relevant_chunk_ids:
    - "sha256:bdb62d2a957b6102e4f7526f08cbd8892faf311c996ce503bc24ceec04be3e16:chunk_1"
  difficulty: medium
  retrieval_type: factual
