- id: q020
  question: "You are designing a low-RAM, latency-sensitive search system over a static corpus of short technical documents. Which ANN index, keyword search approach, and result merging strategy would you choose, and what are the key tradeoffs?"
  ground_truth_answer: |
    For low-RAM constraints with a static corpus, IVFFlat is preferable to HNSW
    because it stores only raw vectors plus a small centroid table, reducing
    memory overhead. Set nprobe to a value between 10 and 50 to balance recall
    and latency. For keyword search, PostgreSQL tsvector with a GIN index avoids
    an external search engine while keeping everything in Postgres. For merging,
    Reciprocal Rank Fusion requires no score normalization and no training data,
    making it operationally simple. The key tradeoff is that IVFFlat recall
    degrades more sharply at low nprobe values than HNSW, particularly in
    high-dimensional spaces, so Recall@5 must be verified on a golden set.
    For very short documents, small chunk sizes (256–512 tokens) with minimal
    overlap are appropriate.
  relevant_chunk_ids:
    - "sha256:6e788380c1a8450cd23b60dc08e52716e934f0d4fc205d9094c8c22caa8832d0:chunk_0"
    - "sha256:6e788380c1a8450cd23b60dc08e52716e934f0d4fc205d9094c8c22caa8832d0:chunk_1"
    - "sha256:93e198fe36bc6adef783e2eb03f7c9e1b3f9f1109f7f913d62c676f573038545:chunk_1"
    - "sha256:ccd43a8b62604a70ced2117351fefe44b1067c24de26c1a3e2220845ab1b51f8:chunk_0"
