- id: q018
  question: "For a memory-constrained deployment serving a static corpus from multiple read-only replicas, which ANN library is more suitable: Annoy or HNSW, and why?"
  ground_truth_answer: |
    Annoy is more suitable in this scenario. Its indexes can be memory-mapped
    from disk, allowing multiple worker processes to share a single .ann file
    simultaneously without duplicating RAM. HNSW, by contrast, loads the full
    graph into memory per process. Annoy's index is also immutable after
    construction, which is acceptable for static corpora. The tradeoff is that
    Annoy achieves lower recall at the same latency compared to HNSW in most
    benchmarks, because random projection trees use fixed splits that may not
    align with the density structure of real embeddings. For read-heavy,
    static workloads where shared memory across replicas is a priority, Annoy
    remains the practical choice despite its recall penalty.
  relevant_chunk_ids:
    - "sha256:a5609ac440410d13326f7ea56ba2cf8fdc260e92cfaa5370f00d9af87315d8d0:chunk_0"
    - "sha256:a5609ac440410d13326f7ea56ba2cf8fdc260e92cfaa5370f00d9af87315d8d0:chunk_1"
    - "sha256:d924db3bd14c860318bf8886f0186e83fc79a3f3a59b3122660be606ef97be00:chunk_0"
  difficulty: hard
  retrieval_type: comparison

- id: q019
  question: "How does RRF compare to score normalization for merging hybrid search results, and when might score normalization be preferred?"
  ground_truth_answer: |
    RRF relies only on rank position and ignores raw scores, making it robust
    to the fact that vector similarity scores (cosine distances) and BM25 scores
    exist on completely different scales. Score normalization min-max scales each
    retriever's scores to [0, 1] and takes a weighted sum. This approach is more
    sensitive to tuning: the normalization range depends on the query distribution
    and optimal weights differ across domains. RRF avoids all tuning with no
    training data required. Score normalization might be preferred when sufficient
    labeled data exists to learn optimal per-retriever weights — in that case a
    learned linear combination or LambdaMART can outperform RRF by adapting
    to query type.
  relevant_chunk_ids:
    - "sha256:ccd43a8b62604a70ced2117351fefe44b1067c24de26c1a3e2220845ab1b51f8:chunk_1"
    - "sha256:ccd43a8b62604a70ced2117351fefe44b1067c24de26c1a3e2220845ab1b51f8:chunk_0"
  difficulty: hard
  retrieval_type: comparison

