- id: q016
  question: "What technique does ScaNN use that makes it outperform standard product quantization at the same compression ratio?"
  ground_truth_answer: |
    ScaNN uses anisotropic vector quantization (AVQ) instead of standard
    product quantization. Standard PQ minimizes reconstruction error uniformly
    across all dimensions. AVQ weights the quantization error by a function of
    the inner product, penalizing error more in dimensions that most distinguish
    near from far neighbors — specifically, the dimensions most likely to affect
    ranking. This direction-aware weighting yields significantly higher recall
    at the same compression ratio, particularly for inner-product similarity
    (dot product). ScaNN's three-stage pipeline adds a rescoring phase to
    further refine the candidates shortlisted by the hashed search.
  relevant_chunk_ids:
    - "sha256:3e868a17a9625f62c06caa138578d5fa0622a238b5e144d37747bac6a089778b:chunk_0"
  difficulty: hard
  retrieval_type: factual

- id: q017
  question: "Why does switching embedding models in a production vector store require a dual-model transition period?"
  ground_truth_answer: |
    A vector store's embedding dimension is baked into the schema at creation
    time. Switching to a different embedding model — even one with the same
    dimension — changes the vector space geometry, making old embeddings
    incompatible with new query embeddings for nearest-neighbor search. A full
    re-embedding of the entire corpus is required. The dual-model transition
    period allows both old and new embeddings to coexist: old embeddings continue
    serving queries while new embeddings are generated in the background. Once
    the full corpus is re-embedded, traffic can be cut over to the new model.
    This avoids downtime during the migration.
  relevant_chunk_ids:
    - "sha256:08b8a22b7f71a409fc7984bbca4815a4dcaa56da5d8cbe0243bfd0ac4dde1717:chunk_1"
  difficulty: hard
  retrieval_type: factual

