- id: q011
  question: "How does a cross-encoder differ from a bi-encoder for document reranking?"
  ground_truth_answer: |
    A bi-encoder encodes the query and each document independently into
    fixed-length vectors; document embeddings can be precomputed and stored,
    making retrieval very fast via ANN search. A cross-encoder, by contrast,
    takes the query and document concatenated as a single input and produces a
    relevance score. This joint processing allows the cross-encoder's attention
    to capture fine-grained interactions between query terms and document
    content, yielding significantly higher precision. The tradeoff is that
    cross-encoders cannot precompute anything and require a forward pass over
    every candidate at query time, limiting practical candidate sizes to 100–200.
  relevant_chunk_ids:
    - "sha256:789e2f54f8fa1e1dcf705a9e0ea963e29d3e2be80ce1ea7bce6e35e8d194006c:chunk_0"
  difficulty: medium
  retrieval_type: comparison

- id: q012
  question: "How does FAISS differ from pgvector for production RAG systems?"
  ground_truth_answer: |
    FAISS is a pure in-process library optimized for large-scale offline search.
    It runs entirely in memory with no SQL overhead and can be 10–100x faster
    for large batch queries, especially with GPU support. pgvector integrates
    vector search directly into Postgres, which allows combined vector and
    metadata filtering (on user_id, topic, or date) in a single SQL query —
    a major advantage for production RAG systems. pgvector also benefits from
    Postgres transactions and existing infrastructure. FAISS is typically used
    when search speed and scale are the primary goals, while pgvector is
    preferred when filtered retrieval or tight database integration matters.
  relevant_chunk_ids:
    - "sha256:f279d7b5fb5b9026ff5ef7c9d90f7c4f21ce8a7ed324f021c403f2dbc2f0bdc8:chunk_1"
    - "sha256:7f5618334f0a3947968911e88378b9643f4522a3d8030d881a65b5b44749b547:chunk_0"
  difficulty: medium
  retrieval_type: comparison

- id: q013
  question: "What are the advantages of parent document retrieval over fixed-token chunking for RAG?"
  ground_truth_answer: |
    Fixed-token chunking splits documents at arbitrary token boundaries, which
    may cut sentences or sections mid-way and reduce coherence. Parent document
    retrieval addresses this by indexing small child chunks for high-precision
    retrieval, then returning the larger parent passage to the LLM for more
    context. This gives the precision of small-chunk retrieval — because the
    vector search matches tightly-scoped passages — combined with the coherence
    of large-chunk context for the LLM. The recommended starting point for
    fixed-token chunking is chunk_size 512 with chunk_overlap 64, but parent
    retrieval is preferred when the LLM frequently reports insufficient
    information.
  relevant_chunk_ids:
    - "sha256:be23e767f6b4c4aea095f5221f13d50c5c67373b3e1751ebad52e2a60ec59943:chunk_0"
    - "sha256:be23e767f6b4c4aea095f5221f13d50c5c67373b3e1751ebad52e2a60ec59943:chunk_1"
  difficulty: medium
  retrieval_type: comparison

