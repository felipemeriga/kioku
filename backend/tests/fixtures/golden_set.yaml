- id: q005
  question: "How does HNSW differ from IVFFlat in terms of memory usage and build speed?"
  ground_truth_answer: |
    HNSW requires more memory than IVFFlat because each node stores edges to m
    neighbors per layer, adding 20–40% overhead on top of the raw embeddings.
    IVFFlat stores only raw vectors plus a small centroid table, giving it lower
    memory overhead. For build speed, IVFFlat is much faster because it only
    requires a single k-means pass. HNSW is slower to build because edges must
    be selected and inserted one vector at a time, making parallelization harder.
  relevant_chunk_ids:
    - "sha256:d924db3bd14c860318bf8886f0186e83fc79a3f3a59b3122660be606ef97be00:chunk_1"
    - "sha256:6e788380c1a8450cd23b60dc08e52716e934f0d4fc205d9094c8c22caa8832d0:chunk_0"
  difficulty: easy
  retrieval_type: comparison

- id: q006
  question: "How does BM25 differ from TF-IDF in handling term frequency?"
  ground_truth_answer: |
    BM25 introduces term frequency saturation: its denominator causes score
    growth to plateau as term frequency increases, so the 1000th occurrence of
    a word contributes almost nothing beyond the 100th. The k1 parameter
    controls how quickly this plateau is reached. TF-IDF, by contrast, has no
    such saturation — raw TF grows linearly without bound, rewarding documents
    with very high term repetition disproportionately. BM25 also adds explicit
    document length normalization via the b parameter, which TF-IDF lacks.
  relevant_chunk_ids:
    - "sha256:e533894d1e4463cb128281d9a4a3532535f6225816fc009679d5b496d1c224a8:chunk_0"
    - "sha256:ea8c4ff9026f27e4474d86a0ea62e514841081d1b90ff925379397a4a6e3d5d7:chunk_1"
  difficulty: easy
  retrieval_type: comparison

