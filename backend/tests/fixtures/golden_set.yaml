- id: q007
  question: "In a hybrid RAG system using Postgres, what components are needed to combine vector and keyword search results?"
  ground_truth_answer: |
    A hybrid RAG system in Postgres requires three components working together.
    First, pgvector provides the vector similarity search using HNSW or IVFFlat
    indexes and the cosine distance operator. Second, PostgreSQL's tsvector and
    GIN index provide the keyword search leg via full-text search. Third,
    Reciprocal Rank Fusion merges the ranked result lists from both legs into a
    single fused ranking without requiring score normalization, since RRF works
    on rank positions rather than raw scores.
  relevant_chunk_ids:
    - "sha256:7f5618334f0a3947968911e88378b9643f4522a3d8030d881a65b5b44749b547:chunk_1"
    - "sha256:93e198fe36bc6adef783e2eb03f7c9e1b3f9f1109f7f913d62c676f573038545:chunk_1"
    - "sha256:ccd43a8b62604a70ced2117351fefe44b1067c24de26c1a3e2220845ab1b51f8:chunk_0"
  difficulty: easy
  retrieval_type: multi_hop

