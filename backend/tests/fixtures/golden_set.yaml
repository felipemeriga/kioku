- id: q014
  question: "How does Elasticsearch implement hybrid vector and keyword search internally?"
  ground_truth_answer: |
    Elasticsearch implements hybrid search by combining a knn search block
    for vector retrieval with a standard query block for full-text search in
    the same request, then merging results using Reciprocal Rank Fusion. Under
    the hood, Elasticsearch's vector indexes use HNSW, the same graph-based
    algorithm described in dedicated ANN literature. The num_candidates
    parameter in the knn block is analogous to ef_search in standalone HNSW
    implementations, controlling recall versus latency. BM25 handles the
    keyword leg. This end-to-end design mirrors the retrieval pattern used in
    modern RAG systems.
  relevant_chunk_ids:
    - "sha256:ab523e996713b7336f5643d7ae9bccf14bb8240e2828ddc8668d6f7672320702:chunk_0"
    - "sha256:ab523e996713b7336f5643d7ae9bccf14bb8240e2828ddc8668d6f7672320702:chunk_1"
    - "sha256:ccd43a8b62604a70ced2117351fefe44b1067c24de26c1a3e2220845ab1b51f8:chunk_0"
  difficulty: medium
  retrieval_type: multi_hop

- id: q015
  question: "What sequence of steps does a well-designed RAG pipeline follow from query to LLM context, combining first-stage retrieval and reranking?"
  ground_truth_answer: |
    A well-designed RAG pipeline follows four stages. First, a bi-encoder ANN
    search recalls a large candidate set (typically top-100) very quickly using
    precomputed document embeddings. Second, RRF may fuse results from vector
    search and keyword search into a unified ranking. Third, a cross-encoder
    reranker scores the top-20 to top-100 candidates precisely by processing
    query and document jointly, pruning to the top-5 results. Finally, the
    reranked chunks are inserted into the LLM context window. Each stage trades
    some latency for precision, so the first stage must achieve sufficient recall
    that the correct answer is present before reranking begins.
  relevant_chunk_ids:
    - "sha256:789e2f54f8fa1e1dcf705a9e0ea963e29d3e2be80ce1ea7bce6e35e8d194006c:chunk_1"
    - "sha256:ccd43a8b62604a70ced2117351fefe44b1067c24de26c1a3e2220845ab1b51f8:chunk_1"
    - "sha256:789e2f54f8fa1e1dcf705a9e0ea963e29d3e2be80ce1ea7bce6e35e8d194006c:chunk_0"
  difficulty: medium
  retrieval_type: multi_hop

