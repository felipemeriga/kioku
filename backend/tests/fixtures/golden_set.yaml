- id: q001
  question: "What does the 'm' parameter in HNSW control?"
  ground_truth_answer: |
    In HNSW, the m parameter controls the number of bidirectional links each
    node maintains in the proximity graph during index construction. Higher m
    values increase recall and memory usage. Typical values range from 16 to 64.
    Memory grows linearly with the number of vectors and the value of m, so
    setting m too high on large corpora significantly increases the index
    footprint.
  relevant_chunk_ids:
    - "sha256:d924db3bd14c860318bf8886f0186e83fc79a3f3a59b3122660be606ef97be00:chunk_0"
  difficulty: easy
  retrieval_type: factual

- id: q002
  question: "What is the default ranking algorithm in Elasticsearch?"
  ground_truth_answer: |
    Elasticsearch uses BM25 (Best Match 25) as its default similarity function
    for full-text search. BM25 replaced the older TF-IDF scoring that was the
    default before Elasticsearch version 5. The k1 and b parameters of BM25
    can be tuned per-index through the similarity settings block to adjust
    term frequency saturation and document length normalization.
  relevant_chunk_ids:
    - "sha256:ab523e996713b7336f5643d7ae9bccf14bb8240e2828ddc8668d6f7672320702:chunk_0"
  difficulty: easy
  retrieval_type: factual

- id: q003
  question: "What does the Annoy library use to build its index?"
  ground_truth_answer: |
    Annoy builds its index as a forest of random projection trees. Each tree is
    constructed by recursively splitting the vector space with random hyperplanes
    until each leaf contains at most a configured number of vectors. The same
    set of vectors appears in all trees, but with different random splits, so
    trees collectively cover different neighborhoods. At query time, Annoy
    traverses all trees simultaneously using a priority queue of candidate nodes.
  relevant_chunk_ids:
    - "sha256:a5609ac440410d13326f7ea56ba2cf8fdc260e92cfaa5370f00d9af87315d8d0:chunk_0"
  difficulty: easy
  retrieval_type: factual

- id: q004
  question: "What is the TTL of cached prefixes in Anthropic's prompt caching?"
  ground_truth_answer: |
    Cached prefixes in Anthropic's prompt caching have a time-to-live (TTL) of
    approximately 5 minutes. After this window expires, the cached key-value
    attention states are no longer available and the next call that uses the
    same prefix will incur a cache-creation charge to rebuild the cache. Cache
    hits are reflected in the usage object via the cache_read_input_tokens and
    cache_creation_input_tokens fields.
  relevant_chunk_ids:
    - "sha256:609b1b596a0b9a490aeed1cbde8fcf39961cadc336cad782c28cd14c9327a796:chunk_1"
  difficulty: easy
  retrieval_type: factual

