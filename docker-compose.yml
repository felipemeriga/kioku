services:
  mem0:
    build:
      context: ./mem0-service
      dockerfile: Dockerfile
    environment:
      - MEM0_DATABASE_URL          # same Postgres as the app; store pins search_path=mem0
      - MEM0_SERVICE_TOKEN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(urllib.request.Request('http://localhost:8010/health',headers={'Authorization':'Bearer '+os.environ['MEM0_SERVICE_TOKEN']}))"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY
      - VOYAGE_API_KEY
      - TAVILY_API_KEY
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - SUPABASE_JWT_SECRET
      - MEM0_SERVICE_URL=http://mem0:8010
      - MEM0_SERVICE_TOKEN
    restart: unless-stopped
    depends_on:
      - mem0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY
      - VOYAGE_API_KEY
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - MCP_API_KEY
      - MEM0_SERVICE_URL=http://mem0:8010
      - MEM0_SERVICE_TOKEN
    restart: unless-stopped
    depends_on:
      - mem0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL
        - VITE_SUPABASE_ANON_KEY
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
