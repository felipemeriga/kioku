[project]
name = "kioku-tsukai"
version = "0.1.22"
description = "Durable native subscription execution service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.135.1,<1", "uvicorn>=0.41,<1", "sqlalchemy[asyncio]>=2.0.48,<3", "asyncpg>=0.31,<1", "pyjwt>=2.11,<3", "jsonschema>=4.26,<5", "httpx>=0.28,<1", "redis>=6,<8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tsukai"]
[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.3", "aiosqlite>=0.22", "ruff>=0.15"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
