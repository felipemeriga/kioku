# kioku — hive/Dokploy deployment (replaces the rag-* stack).
#
# Pattern matches the other hive apps: pre-built felipemeriga1/* images,
# pull_policy: always, the external `proxy` network for Traefik, and env pulled
# from the shared hive .env with a KIOKU_ prefix.
#
# Service NAMES are intentionally generic (backend, mem0, redis) because they're
# baked into images: the frontend nginx proxies /api -> http://backend:8000, the
# backend reaches MEM0_SERVICE_URL=http://mem0:8010 and REDIS_URL=redis://redis.
# container_name is kioku-* so they're unique on the host.
#
# Domains (scheme A): mcp.${DOMAIN} -> MCP, kioku.${DOMAIN} -> UI, api.${DOMAIN} -> REST.

services:
  mem0:
    image: felipemeriga1/kioku-mem0:latest
    pull_policy: always
    container_name: kioku-mem0
    restart: unless-stopped
    environment:
      - MEM0_DATABASE_URL=${KIOKU_MEM0_DATABASE_URL}
      - MEM0_SERVICE_TOKEN=${KIOKU_MEM0_SERVICE_TOKEN}
    networks:
      - kioku

  redis:
    image: redis:7
    pull_policy: always
    container_name: kioku-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - kioku

  backend:
    image: felipemeriga1/kioku-backend:latest
    pull_policy: always
    container_name: kioku-backend
    restart: unless-stopped
    depends_on:
      - mem0
      - redis
    environment:
      - ANTHROPIC_API_KEY=${KIOKU_ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${KIOKU_VOYAGE_API_KEY}
      - TAVILY_API_KEY=${KIOKU_TAVILY_API_KEY}
      - SUPABASE_URL=${KIOKU_SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${KIOKU_SUPABASE_SERVICE_KEY}
      - SUPABASE_JWT_SECRET=${KIOKU_SUPABASE_JWT_SECRET}
      - NOTION_TOKEN_ENCRYPTION_KEY=${KIOKU_NOTION_TOKEN_ENCRYPTION_KEY}
      - MEM0_SERVICE_URL=http://mem0:8010
      - MEM0_SERVICE_TOKEN=${KIOKU_MEM0_SERVICE_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      # Written into every dev's .mcp.json at `kioku init` — must be the public MCP URL.
      - MCP_PUBLIC_URL=https://mcp.${DOMAIN}/sse
    networks:
      - kioku
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kioku-api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.kioku-api.entrypoints=websecure"
      - "traefik.http.routers.kioku-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.kioku-api.loadbalancer.server.port=8000"

  worker:
    image: felipemeriga1/kioku-backend:latest
    pull_policy: always
    container_name: kioku-worker
    restart: unless-stopped
    command: ["arq", "services.queue.settings.WorkerSettings"]
    depends_on:
      - redis
      - mem0
    environment:
      - ANTHROPIC_API_KEY=${KIOKU_ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${KIOKU_VOYAGE_API_KEY}
      - TAVILY_API_KEY=${KIOKU_TAVILY_API_KEY}
      - SUPABASE_URL=${KIOKU_SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${KIOKU_SUPABASE_SERVICE_KEY}
      - NOTION_TOKEN_ENCRYPTION_KEY=${KIOKU_NOTION_TOKEN_ENCRYPTION_KEY}
      - MEM0_SERVICE_URL=http://mem0:8010
      - MEM0_SERVICE_TOKEN=${KIOKU_MEM0_SERVICE_TOKEN}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - kioku

  mcp:
    image: felipemeriga1/kioku-mcp:latest
    pull_policy: always
    container_name: kioku-mcp
    restart: unless-stopped
    depends_on:
      - mem0
    environment:
      - ANTHROPIC_API_KEY=${KIOKU_ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${KIOKU_VOYAGE_API_KEY}
      - SUPABASE_URL=${KIOKU_SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${KIOKU_SUPABASE_SERVICE_KEY}
      - MCP_API_KEY=${KIOKU_MCP_API_KEY}
      - MEM0_SERVICE_URL=http://mem0:8010
      - MEM0_SERVICE_TOKEN=${KIOKU_MEM0_SERVICE_TOKEN}
    networks:
      - kioku
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kioku-mcp.rule=Host(`mcp.${DOMAIN}`)"
      - "traefik.http.routers.kioku-mcp.entrypoints=websecure"
      - "traefik.http.routers.kioku-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.kioku-mcp.loadbalancer.server.port=8001"

  frontend:
    # NOTE: VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY are baked at BUILD time
    # (see build+push step) — they are not runtime env.
    image: felipemeriga1/kioku-frontend:latest
    pull_policy: always
    container_name: kioku-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kioku
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kioku-web.rule=Host(`kioku.${DOMAIN}`)"
      - "traefik.http.routers.kioku-web.entrypoints=websecure"
      - "traefik.http.routers.kioku-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.kioku-web.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
    name: proxy
  kioku:
    driver: bridge
