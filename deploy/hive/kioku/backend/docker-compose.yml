# kioku backend — REST API at api.${DOMAIN}. Reaches mem0/redis by container
# name on the internal `kioku` network. The `backend` alias lets the frontend's
# baked nginx (proxy_pass http://backend:8000) resolve it.
services:
  backend:
    image: felipemeriga1/kioku-backend:latest
    pull_policy: always
    container_name: kioku-backend
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${KIOKU_ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${KIOKU_VOYAGE_API_KEY}
      - TAVILY_API_KEY=${KIOKU_TAVILY_API_KEY}
      - OPENAI_API_KEY=${KIOKU_OPENAI_API_KEY}
      - SUPABASE_URL=${KIOKU_SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${KIOKU_SUPABASE_SERVICE_KEY}
      - SUPABASE_JWT_SECRET=${KIOKU_SUPABASE_JWT_SECRET}
      - SUPABASE_ANON_KEY=${KIOKU_SUPABASE_ANON_KEY}
      - NOTION_TOKEN_ENCRYPTION_KEY=${KIOKU_NOTION_TOKEN_ENCRYPTION_KEY}
      - MEM0_SERVICE_URL=http://kioku-mem0:8010
      - MEM0_SERVICE_TOKEN=${KIOKU_MEM0_SERVICE_TOKEN}
      - REDIS_URL=redis://kioku-redis:6379/0
      - MCP_PUBLIC_URL=https://mcp.${DOMAIN}/sse
    networks:
      kioku:
        aliases:
          - backend
      proxy: {}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kioku-api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.kioku-api.entrypoints=websecure"
      - "traefik.http.routers.kioku-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.kioku-api.loadbalancer.server.port=8000"

networks:
  kioku:
    external: true
    name: kioku
  proxy:
    external: true
    name: proxy
